[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-dl"
version = "0.1.0"
description = "Deep learning fraud detection on IEEE-CIS: transaction transformer, GNN, autoencoder."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.1",
    "torch_geometric>=2.4",
    "captum>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
